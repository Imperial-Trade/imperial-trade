name: Deploy

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Build application
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST || '' }}
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_PUBLIC_POSTHOG_KEY || '' }}
          VITE_BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_ID: ${{ github.run_number }}
          VITE_ENABLE_SW: 'false'
          VITE_SHOW_DEV_TOOLS: 'false'
          VITE_TJ_SOFT_CONTEXT: 'false'
      
      - name: Run basic tests
        run: bun run test:unit || echo "No tests found - continuing with deployment"
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-files
          path: dist/
          retention-days: 1