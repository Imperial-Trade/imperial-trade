name: Deploy

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST || '' }}
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_PUBLIC_POSTHOG_KEY || '' }}
          VITE_BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_ID: ${{ github.run_number }}
          VITE_ENABLE_SW: 'false'
          VITE_SHOW_DEV_TOOLS: 'false'
          VITE_TJ_SOFT_CONTEXT: 'false'
      
      - name: Run basic tests
        run: npm run test:unit || echo "No tests found - continuing with deployment"
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-files
          path: dist/
          retention-days: 1