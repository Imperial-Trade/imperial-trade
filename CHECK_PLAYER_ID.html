<!DOCTYPE html>
<html>
<head>
  <title>Check OneSignal Player ID</title>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body>
  <h1>🔍 Check Your Current OneSignal Player ID</h1>
  <div id="result" style="font-size: 18px; padding: 20px; background: #f0f0f0; margin: 20px;">
    <p>Loading...</p>
  </div>

  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "c6d5466e-9ca7-40b2-90db-57ec42d385ef"
      });

      const permission = await OneSignal.Notifications.permission;
      const isSubscribed = await OneSignal.User.PushSubscription.optedIn;
      const playerId = await OneSignal.User.PushSubscription.id;
      const token = await OneSignal.User.PushSubscription.token;

      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = `
        <h2>Your OneSignal Status:</h2>
        <p><strong>Permission:</strong> ${permission}</p>
        <p><strong>Subscribed:</strong> ${isSubscribed}</p>
        <p><strong>Player ID:</strong> <span style="color: red; font-weight: bold;">${playerId || 'NULL'}</span></p>
        <p><strong>Token:</strong> ${token || 'NULL'}</p>
        <hr>
        <p><strong>Database has:</strong> 28a6bf56-67e6-4cd5-9a89-8ab606ac999e</p>
        <p><strong>Match:</strong> ${playerId === '28a6bf56-67e6-4cd5-9a89-8ab606ac999e' ? '✅ YES' : '❌ NO - THIS IS THE PROBLEM!'}</p>
      `;
    });
  </script>
</body>
</html>
