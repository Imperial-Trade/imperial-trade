<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37"/>
      <stop offset="50%" style="stop-color:#c09a58"/>
      <stop offset="100%" style="stop-color:#aa8640"/>
    </linearGradient>
  </defs>
  
  <!-- Dark background with rounded corners -->
  <rect width="512" height="512" rx="80" ry="80" fill="#1a1a2e"/>
  
  <!-- Outer glow effect -->
  <rect x="8" y="8" width="496" height="496" rx="76" ry="76" fill="none" stroke="url(#goldGradient)" stroke-width="2" opacity="0.4" filter="url(#glow)"/>
  
  <!-- Crown icon - simplified version matching Lucide Crown -->
  <g transform="translate(106, 126)" filter="url(#glow)">
    <path 
      d="M150 0 L180 80 L280 50 L240 180 L60 180 L20 50 L120 80 L150 0 Z" 
      fill="none" 
      stroke="url(#goldGradient)" 
      stroke-width="16" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <!-- Crown base -->
    <path 
      d="M60 200 L240 200" 
      fill="none" 
      stroke="url(#goldGradient)" 
      stroke-width="16" 
      stroke-linecap="round"
    />
    <path 
      d="M70 230 L230 230" 
      fill="none" 
      stroke="url(#goldGradient)" 
      stroke-width="12" 
      stroke-linecap="round"
    />
  </g>
</svg>

