<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Imperial - Offline</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        .offline-container {
            max-width: 400px;
            padding: 40px 20px;
        }
        
        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #c09a58;
            margin-bottom: 24px;
        }
        
        .offline-icon {
            font-size: 64px;
            margin-bottom: 24px;
            opacity: 0.6;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 16px;
            color: #ffffff;
        }
        
        p {
            font-size: 16px;
            line-height: 1.5;
            color: #cccccc;
            margin-bottom: 32px;
        }
        
        .retry-btn {
            background: linear-gradient(135deg, #c09a58 0%, #d4af37 100%);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            color: #000000;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s ease;
        }
        
        .retry-btn:hover {
            transform: translateY(-2px);
        }
        
        .status {
            margin-top: 24px;
            font-size: 14px;
            color: #888888;
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="logo">Trade Imperial</div>
        <div class="offline-icon pulse">📡</div>
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection. Don't worry, we'll reconnect you as soon as you're back online.</p>
        <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
        <div class="status" id="status">Checking connection...</div>
    </div>

    <script>
        // Check connection status
        function updateConnectionStatus() {
            const status = document.getElementById('status');
            if (navigator.onLine) {
                status.textContent = 'Connection restored! Refreshing...';
                setTimeout(() => {
                    window.location.reload();
                }, 1000);
            } else {
                status.textContent = 'Still offline. Please check your connection.';
            }
        }

        // Listen for connection changes
        window.addEventListener('online', updateConnectionStatus);
        window.addEventListener('offline', updateConnectionStatus);

        // Initial status check
        setTimeout(updateConnectionStatus, 1000);
    </script>
</body>
</html>
