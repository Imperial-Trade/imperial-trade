<!DOCTYPE html>
<html>
<head>
    <title>Test Tradermade Health</title>
</head>
<body>
    <h1>Testing Tradermade Streaming Health</h1>
    <div id="results"></div>
    <script>
        async function testHealth() {
            try {
                const response = await fetch('https://kmuoqkcxguafxulqlbmi.supabase.co/functions/v1/tradermade-streaming');
                const data = await response.json();
                document.getElementById('results').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('results').innerHTML = 'Error: ' + error.message;
            }
        }
        testHealth();
    </script>
</body>
</html>
